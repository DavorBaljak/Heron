services:
  loxone-mock:
    build:
      context: .
      target: loxone-mock
    ports:
      - "8180:8080"

  heron-agent:
    build:
      context: .
      target: heron
    depends_on:
      - loxone-mock
    environment:
      # No LOXONE_HOST/USER/PASSWORD here on purpose: the container runs
      # `npm run setup --workspace=@heron/agent` interactively once (saved to
      # the ./data/agent volume below), the same flow as running without
      # Docker at all, instead of pre-baking credentials into compose.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
    volumes:
      - ./data/agent:/app/packages/agent/data
    stdin_open: true
    tty: true

  gateway:
    build:
      context: .
      target: gateway
    depends_on:
      - loxone-mock
    environment:
      # Same setup-then-saved-file flow as heron-agent — no LOXONE_* here.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - GATEWAY_PORT=8090
    ports:
      - "8190:8090"
    volumes:
      - ./data/gateway:/app/packages/gateway/data
